<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0714" />
    <!-- Apply the saved theme before first paint (no flash). Dark is the default; ?theme=light|dark also sets it. -->
    <script>try{var q=/[?&]theme=(light|dark)/.exec(location.search);var t=q?q[1]:localStorage.getItem("lax360-theme");if(q){localStorage.setItem("lax360-theme",t)}if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);if(t==="light"){document.querySelector('meta[name="theme-color"]').setAttribute("content","#ffffff")}}}catch(e){}</script>
    <!-- Welcome intro: on every full load of the homepage (so a browser refresh replays it) hold the page back before first paint and preload only the two brand images. Nothing is stored; rules mirror src/utils/welcomeIntro.js. -->
    <script>try{var l=location,c=navigator.connection;if(l.pathname==="/"&&!matchMedia("(prefers-reduced-motion: reduce)").matches&&!(c&&c.saveData)){document.documentElement.setAttribute("data-intro","pending");["/assets/mascot-welcome.webp","/assets/logo-shield.png"].forEach(function(h){var k=document.createElement("link");k.rel="preload";k.as="image";k.href=h;document.head.appendChild(k)})}}catch(e){}</script>
    <link rel="icon" type="image/png" href="/assets/logo-shield.png" />
    <title>LAX360 Ventures — Software, AI, Digital Growth, CAD &amp; Academy</title>
    <meta name="description" content="One team to build, automate and grow your business. Custom software, AI automation, digital marketing, CAD engineering and training from LAX360 Ventures." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LAX360 Ventures" />
    <meta property="og:title" content="LAX360 Ventures — One team to build, automate and grow your business" />
    <meta property="og:description" content="Custom software, AI automation, digital marketing, CAD engineering and training under one roof." />
    <meta property="og:image" content="/assets/logo-shield.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
