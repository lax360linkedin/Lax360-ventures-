<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c10" />
    <!-- Apply the theme before first paint (no flash): the website theme a Super Admin chose (cached as lax360-site-theme), else the visitor's saved Dark/Light choice. Dark is the default; ?theme=light|dark|snow|rose|sage also sets the visitor choice. -->
    <script>try{var ok=/^(light|dark|snow|rose|sage)$/,q=/[?&]theme=(light|dark|snow|rose|sage)/.exec(location.search),s=localStorage.getItem("lax360-site-theme"),t=q?q[1]:(ok.test(s)?s:localStorage.getItem("lax360-theme"));if(q){localStorage.setItem("lax360-theme",t)}if(ok.test(t)){var d=document.documentElement;d.setAttribute("data-theme",t==="dark"?"dark":"light");if(/^(snow|rose|sage)$/.test(t)){d.setAttribute("data-palette",t)}document.querySelector('meta[name="theme-color"]').setAttribute("content",{dark:"#0a0c10",light:"#ffffff",snow:"#fafafa",rose:"#fffafa",sage:"#fbfdfa"}[t])}}catch(e){}</script>
    <!-- Welcome intro: on every full load of the homepage (so a browser refresh replays it) hold the page back before first paint and preload only the two brand images. Nothing is stored; rules mirror src/utils/welcomeIntro.js. -->
    <script>try{var l=location,c=navigator.connection;if(l.pathname==="/"&&!matchMedia("(prefers-reduced-motion: reduce)").matches&&!(c&&c.saveData)){document.documentElement.setAttribute("data-intro","pending");["/assets/mascot-welcome.webp","/assets/logo-shield.png"].forEach(function(h){var k=document.createElement("link");k.rel="preload";k.as="image";k.href=h;document.head.appendChild(k)})}}catch(e){}</script>
    <link rel="icon" type="image/png" href="/assets/logo-shield.png" />
    <title>LAX360 Ventures — Software, AI, Digital Growth &amp; Training</title>
    <meta name="description" content="One team to build, automate and grow your business. Custom software, AI automation, digital marketing and training from LAX360 Ventures." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LAX360 Ventures" />
    <meta property="og:title" content="LAX360 Ventures — One team to build, automate and grow your business" />
    <meta property="og:description" content="Custom software, AI automation, digital marketing and training under one roof." />
    <meta property="og:image" content="/assets/logo-shield.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
